<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Canvas · render picker open</title>
<script src="./support.js"></script>
<script src="data/fixtures.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="ds/web/tokens.css">
<link rel="stylesheet" href="ds/web/bundle.css">
<link rel="stylesheet" href="viewer.css">
</helmet>
<dc-import name="Canvas" overlay="picker" voice="stationery" scheme="{{ scheme }}" pen="{{ pen }}" hint-size="100%,900px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scheme": {"editor": "enum", "options": ["paper", "night", "eink"], "default": "paper"}, "pen": {"editor": "enum", "options": ["1", "2", "3"], "default": "1"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { scheme: p.scheme ?? 'paper', pen: p.pen ?? '1' };
  }
}
</script>
</body>
</html>
