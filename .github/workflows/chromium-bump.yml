name: chromium-bump
# Every week: moves tools/chromium.pin to the newest Chromium of the Alpine release the boards run
# in, before Alpine drops the pinned package and every boards check fails (README "References").
# tools/chromium-bump renders every reference with the new Chromium and runs the boards checks;
# then one pull request from the branch chromium-bump is opened or updated: the pin alone when
# every reference renders pixel-identical, the pin and the new references, with the changed cases
# listed for review, when not. Nothing happens while the pin is the newest.
on:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write        # push the branch chromium-bump
  pull-requests: write   # open or edit its pull request
  actions: write         # start build.yml and safety.yml on it: a push with this token starts no workflow

concurrency: chromium-bump

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: newest Chromium, the references rendered and checked with it
        id: bump
        run: |
          rc=0
          tools/chromium-bump out/chromium-bump.md || rc=$?
          case $rc in
            0) echo "result=identical" >> "$GITHUB_OUTPUT" ;;
            3) echo "result=changed" >> "$GITHUB_OUTPUT" ;;
            4) echo "result=current" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac
          if [ -f out/chromium-bump.md ]; then cat out/chromium-bump.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: the renders and the differences
        if: steps.bump.outputs.result == 'changed'
        uses: actions/upload-artifact@v7
        with:
          name: references
          path: out/chromium-bump/references/
      - name: pull request
        if: steps.bump.outputs.result == 'identical' || steps.bump.outputs.result == 'changed'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.bump.outputs.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pin=$(cat tools/chromium.pin)
          title="references: Chromium ${pin%-r*}"
          if [ "$RESULT" = changed ]; then title="$title, references changed (review)"; fi
          body=out/chromium-bump.md
          {
            echo
            echo "This run: $RUN"
            echo
            echo "Checks: a push with the workflow's token starts no workflow, so the run starts \`build.yml\` and \`safety.yml\` on this branch (workflow_dispatch); their runs show on the commit. The run above rendered and checked every reference itself."
          } >> "$body"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c chromium-bump
          git add -A
          git commit -q -m "$title" -m "Generated by the chromium-bump workflow (tools/chromium-bump)."
          # one branch for every bump, never force-pushed: an earlier tip is merged with this tree
          # kept (-s ours), so the push is a fast-forward; the same tree is not pushed again
          push=true
          if git fetch -q origin chromium-bump 2>/dev/null; then
            if git diff --quiet FETCH_HEAD HEAD; then
              push=false
            else
              git merge -q -s ours --no-edit -m "Merge the earlier chromium-bump" FETCH_HEAD
            fi
          fi
          if [ "$push" = true ]; then git push origin HEAD:chromium-bump; else echo "chromium-bump already holds this change"; fi
          if [ "$(gh pr view chromium-bump --json state -q .state 2>/dev/null)" = OPEN ]; then
            gh pr edit chromium-bump --title "$title" --body-file "$body"
          else
            gh pr create --head chromium-bump --base main --title "$title" --body-file "$body"
          fi
          if [ "$push" = true ]; then
            gh workflow run build.yml --ref chromium-bump
            gh workflow run safety.yml --ref chromium-bump
          fi
