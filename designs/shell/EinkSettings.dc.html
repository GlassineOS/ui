<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&amp;family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=block" rel="stylesheet"></helmet>
<sc-if value="{{ wrap }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:12px;width:{{ devF.ow }}"><dc-import name="EinkShell" settings="{{ true }}" theme="{{ themeId }}" scheme="{{ schemeId }}" pen="{{ penId }}" orient="{{ orientId }}" win="{{ win }}" settings-page="{{ pageProp }}" settings-app="{{ appProp }}" settings-pk="{{ pkProp }}" hint-size="760px,1060px"></dc-import><div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px"><span style="font:500 11.5px 'IBM Plex Mono';color:#555555;padding-right:4px">Window</span><sc-for list="{{ chips }}" as="c" hint-placeholder-count="4"><div onClick="{{ c.on }}" style="font:500 11.5px 'IBM Plex Mono';padding:7px 11px;border-radius:6px;border:1px solid rgba(0,0,0,.2);cursor:pointer;background:{{ c.bg }};color:{{ c.fg }}">{{ c.label }}</div></sc-for></div></div></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:1140},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;white&quot;,&quot;editorial&quot;,&quot;stationery&quot;],&quot;default&quot;:&quot;stationery&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;page&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;eink&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;app&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Stellarium&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;win&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;full&quot;,&quot;column&quot;,&quot;row&quot;,&quot;quarter&quot;],&quot;default&quot;:&quot;full&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;orient&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;portrait&quot;,&quot;landscape&quot;],&quot;default&quot;:&quot;portrait&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;nav&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;folder&quot;],&quot;default&quot;:&quot;folder&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;scheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;paper&quot;,&quot;night&quot;,&quot;eink&quot;],&quot;default&quot;:&quot;paper&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;1&quot;,&quot;2&quot;,&quot;3&quot;],&quot;default&quot;:&quot;1&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  // Board wrapper: the shell with Settings in a window, plus window-size chips. All settings logic lives in EinkSettingsCard.
  state = { win: null };
  renderVals() {
    const s = this.state, p = this.props, u = x => this.setState(x);
    const LAND = (p.orient ?? 'portrait') === 'landscape', win = s.win ?? p.win ?? 'full';
    const themeId = ['white', 'editorial', 'stationery'].includes(s.theme ?? p.theme) ? (s.theme ?? p.theme) : 'white';
    return {
      wrap: !p.bare, themeId, schemeId: 'eink', penId: '1', orientId: LAND ? 'landscape' : 'portrait', win,
      pageProp: p.page || 'eink', appProp: p.app || 'Stellarium', pkProp: p.pk || '',
      devF: { ow: (LAND ? 1060 : 760) + 'px' },
      chips: [['full', 'Full screen'], ['column', 'Left half'], ['row', 'Top half'], ['quarter', 'Quarter']].map(([id, label]) => ({ label, bg: win === id ? '#111111' : 'transparent', fg: win === id ? '#ffffff' : '#111111', on: () => u({ win: id }) }))
    };
  }
}
</script>
</body>
</html>
