<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The hidden count · two forms</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div data-spec-id="hidden.count" style="width:824px;height:1352px;box-sizing:border-box;padding:28px 32px;display:flex;flex-direction:column;gap:18px;background:#e6e6e6;color:#1b1b1b;font-family:'IBM Plex Sans',sans-serif">
<div style="display:flex;flex-direction:column;gap:6px">
<span style="font:500 13px/1.2 'IBM Plex Mono',monospace;color:#3d3d3d">hidden.count</span>
<h1 style="margin:0;font:600 26px/1.2 'IBM Plex Sans',sans-serif;text-wrap:balance">The hidden count · two forms</h1>
<p style="margin:0;max-width:760px;font:400 15px/1.5 'IBM Plex Sans',sans-serif;color:#2b2b2b;text-wrap:pretty">Agenda only: four kinds of entry have no widget here. A: one quiet line in the foot, per kind and per slot. B: one hairline chip per kind or slot. Either way a tap opens the list; nothing asks to confirm a switch, since nothing is lost.</p>
</div>
<dc-import name="ThemeBar" voice="{{ voice }}" on-pick="{{ pick }}" hint-size="100%,112px"></dc-import>
<dc-import name="Planner" voice="{{ voice }}" orient="portrait" tmpl="day-agenda" count="{{ count }}" hint-size="760px,1008px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"voice": {"editor": "enum", "options": ["white", "editorial", "stationery"], "default": "white"}, "count": {"editor": "enum", "options": ["line", "chips"], "default": "line"}, "$preview": {"width": 824, "height": 1352}, "$states": [{"id": "line", "name": "A · one line", "props": {"count": "line"}}, {"id": "chips", "name": "B · a chip per kind", "props": {"count": "chips"}}]}'>
class Component extends DCLogic {
  state = {};
  renderVals() {
    const s = this.state, p = this.props;
    return { voice: s.voice ?? p.voice ?? 'white', pick: (k, v) => this.setState({ [k]: v }), count: p.count ?? "line" };
  }
}
</script>
</body>
</html>
