<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Day · agenda and lists, turned</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div data-spec-id="day.lists.landscape" style="width:1080px;height:1104px;box-sizing:border-box;padding:28px 32px;display:flex;flex-direction:column;gap:18px;background:#e6e6e6;color:#1b1b1b;font-family:'IBM Plex Sans',sans-serif">
<div style="display:flex;flex-direction:column;gap:6px">
<span style="font:500 13px/1.2 'IBM Plex Mono',monospace;color:#3d3d3d">day.lists.landscape</span>
<h1 style="margin:0;font:600 26px/1.2 'IBM Plex Sans',sans-serif;text-wrap:balance">Day · agenda and lists, turned</h1>
<p style="margin:0;max-width:1016px;font:400 15px/1.5 'IBM Plex Sans',sans-serif;color:#2b2b2b;text-wrap:pretty">The same template turned: its root column becomes a row and the lower row a column (a node may change kind by orientation), so the week’s to-dos and the notes stand in a third column instead of a strip at the bottom.</p>
</div>
<dc-import name="ThemeBar" voice="{{ voice }}" on-pick="{{ pick }}" hint-size="100%,112px"></dc-import>
<dc-import name="Planner" voice="{{ voice }}" orient="landscape" tmpl="day-lists" hint-size="1008px,760px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"voice": {"editor": "enum", "options": ["white", "editorial", "stationery"], "default": "white"}, "$preview": {"width": 1080, "height": 1104}}'>
class Component extends DCLogic {
  state = {};
  renderVals() {
    const s = this.state, p = this.props;
    return { voice: s.voice ?? p.voice ?? 'white', pick: (k, v) => this.setState({ [k]: v }) };
  }
}
</script>
</body>
</html>
