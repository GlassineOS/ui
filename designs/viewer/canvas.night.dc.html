<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Canvas · the viewer at night, boards in E-ink</title>
<script src="./support.js"></script>
<script src="data/fixtures.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="ds/web/tokens.css">
<link rel="stylesheet" href="ds/web/bundle.css">
<link rel="stylesheet" href="viewer.css">
</helmet>
<dc-import name="Canvas" chrome="white-night" scheme="eink" selected="settings.light" voice="{{ voice }}" pen="{{ pen }}" hint-size="100%,900px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"voice": {"editor": "enum", "options": ["white", "editorial", "stationery"], "default": "white"}, "pen": {"editor": "enum", "options": ["1", "2", "3"], "default": "1"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { voice: p.voice ?? 'white', pen: p.pen ?? '1' };
  }
}
</script>
</body>
</html>
