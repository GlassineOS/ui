<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Item pill</title>
<script src="./support.js"></script>
<script src="data/fixtures.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<span style="{{wrap}}">
  <sc-if value="{{isIssue}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" style="flex: none"><circle cx="8" cy="8" r="6" fill="none" stroke="#111111" stroke-width="1.6"></circle><circle cx="8" cy="8" r="1.8" fill="{{dot}}"></circle></svg></sc-if>
  <sc-if value="{{isPr}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#111111" stroke-width="1.6" aria-hidden="true" style="flex: none"><circle cx="4" cy="3.5" r="1.8"></circle><circle cx="4" cy="12.5" r="1.8"></circle><circle cx="12" cy="12.5" r="1.8"></circle><path d="M4 5.3v5.4M12 10.7V7a3 3 0 0 0-3-3H7"></path></svg></sc-if>
  <sc-if value="{{isRun}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" style="flex: none"><rect x="2" y="2" width="12" height="12" rx="2.5" fill="none" stroke="#111111" stroke-width="1.6"></rect><path d="M6.5 5.5l4 2.5-4 2.5z" fill="#111111"></path></svg></sc-if>
  <a href="WorkItem.dc.html" title="{{tip}}" style="display: flex; align-items: baseline; gap: 6px; min-width: 0; color: #111111; text-decoration: none">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 600; white-space: nowrap">{{ref}}</span>
    <sc-if value="{{showTitle}}" hint-placeholder-val="{{true}}"><span style="{{titleStyle}}">{{title}}</span></sc-if>
  </a>
  <sc-if value="{{showState}}" hint-placeholder-val="{{false}}"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; padding: 0 5px; border: 1.5px solid #111111; border-radius: 4px; white-space: nowrap">{{state}}</span></sc-if>
  <sc-if value="{{removable}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{remove}}" aria-label="Remove {{ref}}" style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; flex: none; border: 0; border-radius: 999px; background: #f2f2f2; cursor: pointer"><svg width="10" height="10" viewBox="0 0 12 12" stroke="#111111" stroke-width="1.6" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6"></path></svg></button></sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"itemRef":{"editor":"text","default":"epd#9"},"removable":{"editor":"boolean","default":false},"compact":{"editor":"boolean","default":false},"tone":{"editor":"enum","options":["plain","waiting","pr"],"default":"plain"},"maxTitle":{"editor":"text","default":"28ch"},"onRemove":{"editor":null},"$preview":{"width":420,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    const P = this.props, H = window.HUB;
    const ref = P.itemRef || 'epd#9';
    const it = H.items[ref] || { kind: 'issue', title: '', state: '' };
    const kind = it.kind === 'roadmap' ? 'issue' : it.kind;
    const compact = !!P.compact, rm = !!P.removable;
    const bg = P.tone === 'waiting' ? '#ffd86b' : '#ffffff';
    const closed = it.state === 'CLOSED' || it.state === 'MERGED';
    return {
      ref, title: it.title || '', tip: ref + (it.title ? ' — ' + it.title : '') + (it.state ? ' · ' + it.state : ''),
      isIssue: kind === 'issue', isPr: kind === 'pr', isRun: kind === 'run', dot: closed ? '#111111' : '#ffffff',
      showTitle: !compact && !!it.title, showState: !compact && closed, state: it.state,
      titleStyle: 'font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: ' + (P.maxTitle || '28ch'),
      removable: rm, remove: () => { if (P.onRemove) P.onRemove(ref); },
      wrap: 'display: inline-flex; align-items: center; gap: 6px; max-width: 100%; box-sizing: border-box; min-height: ' + (compact ? '28px' : '36px') + '; padding: 0 ' + (rm ? '3px' : '10px') + ' 0 9px; border: 1.5px ' + (P.tone === 'pr' ? 'dashed' : 'solid') + ' #111111; border-radius: 999px; background: ' + bg + '; font-family: \'IBM Plex Sans\', system-ui, sans-serif; color: #111111; line-height: 1.3'
    };
  }
}
</script>
</body>
</html>
