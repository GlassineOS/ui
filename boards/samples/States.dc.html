<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>States</title>
<script src="./support.js"></script>
<script src="data/sample.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin: 0; font: 15px/1.4 system-ui, sans-serif; }
.row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #cccccc; }
</style>
</helmet>
<section id="states" data-bt="{{ bt }}" style="padding: 20px; background: #ffffff; color: #111111">
  <h1 style="margin: 0 0 8px; font-size: 20px">Bluetooth</h1>
  <div class="row"><span>Bluetooth</span><b id="bt">{{ btLabel }}</b></div>
  <sc-if value="{{ scanning }}" hint-placeholder-val="{{ false }}"><p id="scanning">Looking for devices near {{ owner }}…</p></sc-if>
  <sc-if value="{{ connected }}" hint-placeholder-val="{{ false }}">
    <div class="row"><span id="paired">{{ paired }}</span><dc-import name="sub/Badge" text="connected" hint-size="100px,24px"></dc-import></div>
  </sc-if>
  <p><a id="to-counter" href="Counter.dc.html">Open the <b>counter</b></a> · <a id="to-main" href="/Main.dc.html?voice=white#main">Main</a></p>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{
  "$preview": { "width": 420, "height": 240 },
  "$states": [
    { "id": "off", "name": "Off", "props": { "bt": "off" } },
    { "id": "on", "name": "On", "props": { "bt": "on" }, "from": [{ "state": "off", "label": "Turn on" }] },
    { "id": "scanning", "name": "Scanning", "props": { "bt": "scan" }, "from": [{ "state": "on", "label": "Scan" }] },
    { "id": "connected", "name": "Connected", "props": { "bt": "on", "paired": "Keyboard K380" }, "from": [{ "state": "scanning", "label": "Pair" }] }
  ],
  "bt": { "editor": "enum", "options": ["off", "on", "scan"], "default": "off" },
  "paired": { "editor": "text", "default": "" }
}'>
class Component extends DCLogic {
  renderVals() {
    const bt = this.props.bt ?? 'off';
    const paired = this.props.paired ?? '';
    return {
      bt: bt,
      btLabel: bt === 'off' ? 'Off' : bt === 'scan' ? 'Scanning' : 'On',
      scanning: bt === 'scan',
      connected: bt === 'on' && !!paired,
      paired: paired,
      owner: window.SAMPLE ? window.SAMPLE.owner : '',
    };
  }
}
</script>
</body>
</html>
