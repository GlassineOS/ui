<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nested</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body { margin: 0; font: 15px/1.4 system-ui, sans-serif; }</style>
</helmet>
<div style="padding: 24px; display: flex; flex-direction: column; gap: 8px">
  <span>Badges from this folder:</span>
  <div style="display: flex; gap: 6px">
    <sc-for list="{{ tags }}" as="t" hint-placeholder-count="2">
      <sc-for list="{{ t.parts }}" as="p" hint-placeholder-count="2">
        <dc-import name="Badge" text="{{ t.name }}/{{ p }}" hint-size="80px,28px"></dc-import>
      </sc-for>
    </sc-for>
  </div>
  <a id="to-counter" href="/Counter.dc.html">Counter (from the canvas root)</a>
  <a id="external" href="https://example.org/">Elsewhere</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":420,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    return { tags: [{ name: 'x', parts: ['1', '2'] }, { name: 'y', parts: ['3'] }] };
  }
}
</script>
</body>
</html>
