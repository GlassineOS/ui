name: reference
# The published site (spec 002 FR-031, spec 003 FR-016, FR-017): the Interleaf reference and the
# design boards (make site), built from main and published to GitHub Pages in one deployment.
# The boards of each open pull request of this repository that changes designs/ are part of the same
# build: design-pr.yml starts this workflow on main whenever such a pull request opens, changes or
# closes. This run reads the pull requests' designs/ files as data (tools/fetch-design-prs) and
# exports them with main's tools; no tool or script of a pull request runs. The review of each
# (spec 003 FR-055) has difference images of the boards it changes: main's and the pull request's
# boards are rendered in headless Chromium (the pinned one), so the boards' own JavaScript runs in
# that browser during the build, in a container without network, without the token and without the
# checkout's .git. After the deployment, each published pull request gets one comment with its
# link, edited in place on every publish.
# The origin: a published pull request's boards run their JavaScript in the visitor's browser on the
# organization's github.io origin, beside the reference and every other page there. That is
# acceptable only because a pull request from this repository comes from someone who already has
# write access to it (and so to this site). Pull requests from forks are therefore never published
# (tools/fetch-design-prs); do not relax that rule. The site loads nothing from another site: the
# boards' Google Fonts links name the vendored faces (tools/boards export).
# Pull requests build the reference in make check-forms (test/test_reference.py).
# Pages must use "GitHub Actions" as its source (Settings > Pages > Build and deployment).
# A deployment that hangs does not recover when re-run from the same commit; a new commit on
# main (or a manual run after one) does.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# one deployment at a time; a newer push waits instead of cancelling one in flight
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      # the result of a pull request's checks on the designs page (tools/fetch-design-prs)
      checks: read
    outputs:
      prs: ${{ steps.published.outputs.prs }}
    steps:
      - uses: actions/checkout@v7
      - name: the designs/ files of the open pull requests that change a design
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tools/fetch-design-prs out/prs
      # python3 (stdlib only), make, node and Chromium as pinned in tools/chromium.pin, as in the checks;
      # the npm dev dependencies (puppeteer-core) installed with network, then the site built without
      # network, token or .git (the boards of the pull requests run in that Chromium)
      - name: Alpine with the pinned Chromium
        run: |
          docker build -t site --build-arg CHROMIUM="$(cat tools/chromium.pin)" - <<'EOF'
          FROM alpine:3.24
          ARG CHROMIUM
          RUN apk add --no-cache "chromium=$CHROMIUM" nodejs npm font-dejavu make python3
          EOF
          docker run --rm -v "$PWD":/src -w /src site npm ci --ignore-scripts --no-audit --no-fund
      - name: make site on Alpine, no network
        run: |
          docker run --rm --network none -v "$PWD":/src --mount type=tmpfs,destination=/src/.git -w /src \
            -e CHROMIUM=/usr/bin/chromium-browser site make site SITE_PRS=out/prs SITE_DIFFS=1
      # the pull requests that made it into the site, as "N:HEAD:PROJECT,PROJECT" (names checked by
      # tools/site-designs and gen-reference: digits, hex, letters . _ -)
      - name: the published pull requests
        id: published
        run: |
          prs=
          for d in out/reference/designs/pr-*/; do
            [ -f "$d/pr.json" ] || continue
            n=$(jq -r .number "$d/pr.json"); head=$(jq -r .head "$d/pr.json")
            projects=$(cd "$d" && for p in */; do printf '%s,' "${p%/}"; done)
            prs="$prs $n:$head:${projects%,}"
          done
          echo "prs=${prs# }" >> "$GITHUB_OUTPUT"
          echo "pull requests on the site: ${prs:- none}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out/reference
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
  # one comment per published pull request, with the link, written once the site holds it
  link:
    needs: [build, deploy]
    if: needs.build.outputs.prs != ''
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: the link on each pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PRS: ${{ needs.build.outputs.prs }}
          SITE: ${{ needs.deploy.outputs.url }}
        run: |
          # a failed lookup must fail the step, not post a second comment
          set -o pipefail
          mark='<!-- boards-pages -->'
          for pr in $PRS; do
            n=${pr%%:*}; rest=${pr#*:}; head=${rest%%:*}; projects=${rest#*:}
            at="${SITE%/}/designs/pr-$n/"
            body="$mark
          **Boards of this pull request**, rendered in your browser: $at
          "
            for p in $(echo "$projects" | tr ',' ' '); do body="$body
          - [$p](${at}$p/_boards/): [the review](${at}$p/_boards/review.html) of the boards it adds, changes and removes"; done
            body="$body

          As of $head. Updated with every push to this pull request; the copy leaves the site when it closes. Every design on main: ${SITE%/}/designs.html"
            id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$n/comments" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$mark\"))) | .id" | head -n 1)
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
            else
              gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments" -f body="$body" >/dev/null
            fi
            echo "#$n: $at"
          done
