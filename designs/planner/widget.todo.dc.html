<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget · To-do list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div data-spec-id="widget.todo" style="width:824px;height:764px;box-sizing:border-box;padding:28px 32px;display:flex;flex-direction:column;gap:18px;background:#e6e6e6;color:#1b1b1b;font-family:'IBM Plex Sans',sans-serif">
<div style="display:flex;flex-direction:column;gap:6px">
<span style="font:500 13px/1.2 'IBM Plex Mono',monospace;color:#3d3d3d">widget.todo</span>
<h1 style="margin:0;font:600 26px/1.2 'IBM Plex Sans',sans-serif;text-wrap:balance">Widget · To-do list</h1>
<p style="margin:0;max-width:760px;font:400 15px/1.5 'IBM Plex Sans',sans-serif;color:#2b2b2b;text-wrap:pretty">Truncates. One ink line per to-do, a tick box, and always one empty row to write in. Past full, rows give way (done first, then the oldest open) and “+n more” opens the whole list. The minimum holds one entry, the empty row and the mark.</p>
</div>
<dc-import name="ThemeBar" voice="{{ voice }}" on-pick="{{ pick }}" hint-size="100%,112px"></dc-import>
<dc-import name="Planner" voice="{{ voice }}" orient="portrait" screen="sheet" widget="todo" fill="{{ fill }}" hint-size="760px,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"voice": {"editor": "enum", "options": ["white", "editorial", "stationery"], "default": "white"}, "fill": {"editor": "enum", "options": ["empty", "full", "more"], "default": "full"}, "$preview": {"width": 824, "height": 764}, "$states": [{"id": "full", "name": "Full", "props": {"fill": "full"}}, {"id": "empty", "name": "Empty", "props": {"fill": "empty"}}, {"id": "more", "name": "Past full: +n more", "props": {"fill": "more"}, "from": [{"state": "full", "label": "more than fits"}]}]}'>
class Component extends DCLogic {
  state = {};
  renderVals() {
    const s = this.state, p = this.props;
    return { voice: s.voice ?? p.voice ?? 'white', pick: (k, v) => this.setState({ [k]: v }), fill: p.fill ?? "full" };
  }
}
</script>
</body>
</html>
