<!-- @dsCard group="Content" height=420 subtitle="Modal question with what it changes and two answers" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dialog — preview</title></head>
<body style="margin:0">
<div class="il-page">
  <div class="il-dialog-scrim" style="position:relative;inset:auto;min-height:420px">
    <section class="il-dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
      <div class="il-dialog__head">
        <span class="il-label">Confirm</span>
        <h2 class="il-dialog__title" id="dlg-t">Give this session more access?</h2>
      </div>
      <div class="il-dialog__body">
        <p>The next step can do two things this one can’t:</p>
        <ul style="margin:0">
          <li>Edit files in its own checkout</li>
          <li>Push to its own branch</li>
        </ul>
      </div>
      <div class="il-dialog__actions">
        <button class="il-btn" type="button">Not now</button>
        <button class="il-btn il-btn--primary" type="button">Confirm and go on</button>
      </div>
    </section>
  </div>
</div>
<script>/* static preview */</script>
</body>
</html>
