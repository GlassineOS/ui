<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#1b1b1b}a:hover{color:#4a4a4a}</style>
</helmet>
<div data-spec-id="wizard.welcome" style="width:824px;height:1500px;box-sizing:border-box;padding:28px 32px;display:flex;flex-direction:column;gap:18px;background:#e6e6e6;color:#1b1b1b;font-family:'IBM Plex Sans',sans-serif">
<div style="display:flex;flex-direction:column;gap:6px">
<span style="font:500 13px/1.2 'IBM Plex Mono',monospace;color:#3d3d3d">wizard.welcome</span>
<h1 style="margin:0;font:600 26px/1.2 'IBM Plex Sans',sans-serif;text-wrap:balance">Welcome</h1>
<p style="margin:0;max-width:760px;font:400 15px/1.5 'IBM Plex Sans',sans-serif;color:#2b2b2b;text-wrap:pretty">First start of the app. One screen says what it is for: you write words it shows, it learns your hand, everything stays on the tablet. A sample word on the writing paper shows what that looks like. Five steps in the header; Skip to writing on every step but the last.</p>
</div>
<dc-import name="ThemeBar" voice="{{ voice }}" on-pick="{{ pick }}" hint-size="100%,112px"></dc-import>
<dc-import name="Handwriting" theme="{{ voice }}" scheme="eink" pen="1" orient="portrait" screen="w-welcome" hint-size="760px,994px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"voice": {"editor": "enum", "options": ["white", "editorial", "stationery"], "default": "white"}, "$preview": {"width": 824, "height": 1500}}'>
class Component extends DCLogic {
  state = {};
  renderVals() {
    const s = this.state, p = this.props;
    return { voice: s.voice ?? p.voice ?? 'white', pick: (k, v) => this.setState({ [k]: v }) };
  }
}
</script>
</body>
</html>
