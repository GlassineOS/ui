name: build
# one run per change: pushes to main, and pull requests (a push to a PR branch runs as the PR)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # a pull request runs the library checks only when tools/ci-scope says they can be
      # affected; main and manual runs always run everything
      - name: scope
        id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            scope=$(git diff --name-only HEAD^1 HEAD | sh tools/ci-scope)
          else
            scope=lib
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "checks: $scope"
      - name: make check-forms on Alpine
        if: steps.scope.outputs.scope == 'forms'
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.24 sh -euc '
            apk add -q python3 make
            make check-forms'
      - name: make check on Alpine
        if: steps.scope.outputs.scope == 'lib'
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.24 sh -euc '
            apk add -q build-base pkgconf cairo-dev pango-dev librsvg-dev glib-dev \
              python3 py3-gobject3 py3-cairo gtk+3.0 font-dejavu adwaita-icon-theme nodejs
            make check'
  boards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # Chromium as pinned in tools/chromium.pin (the references' contract), and the npm dev
      # dependencies; the checks themselves run without network
      - name: Alpine with the pinned Chromium
        run: |
          docker build -t boards --build-arg CHROMIUM="$(cat tools/chromium.pin)" - <<'EOF'
          FROM alpine:3.24
          ARG CHROMIUM
          RUN apk add --no-cache "chromium=$CHROMIUM" nodejs npm font-dejavu make
          EOF
          docker run --rm -v "$PWD":/src -w /src boards npm ci --ignore-scripts --no-audit --no-fund
      - name: design boards and references in headless Chromium, no network
        run: |
          docker run --rm --network none -v "$PWD":/src -w /src -e CHROMIUM=/usr/bin/chromium-browser boards \
            make -k check-boards boards-check designs-check references
      - name: the differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: references
          path: out/references/
          if-no-files-found: ignore
      # spec 003 FR-015: the boards a pull request changes, as images kept with the run
      - name: render the changed boards, no network
        if: (success() || failure()) && github.event_name == 'pull_request'
        run: |
          mkdir -p out
          git diff --name-only HEAD^1 HEAD -- designs/ > out/designs-changed.txt
          if [ -s out/designs-changed.txt ]; then
            docker run --rm --network none -v "$PWD":/src -w /src -e CHROMIUM=/usr/bin/chromium-browser boards \
              make designs-shots
          fi
      - name: keep the images of the changed boards
        if: (success() || failure()) && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: design-shots
          path: out/shots/
          if-no-files-found: ignore
  contrast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # spec 002 FR-020: the contrast check, its self-test and the known failures it must catch;
      # the report (out/contrast.json) is kept as an artifact
      - name: contrast check in headless Chromium on Alpine
        run: |
          docker run --rm -v "$PWD":/src -w /src -e CHROMIUM=/usr/bin/chromium-browser alpine:3.24 sh -euc '
            apk add -q chromium nodejs npm font-dejavu make
            npm ci --ignore-scripts --no-audit --no-fund
            make contrast-check contrast-test CONTRAST_JOBS=4'
      - name: keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contrast-report
          path: out/contrast.json
          if-no-files-found: ignore
