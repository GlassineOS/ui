<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>No handwriting service</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div data-spec-id="start.refused" style="width:824px;height:1352px;box-sizing:border-box;padding:28px 32px;display:flex;flex-direction:column;gap:18px;background:#e6e6e6;color:#1b1b1b;font-family:'IBM Plex Sans',sans-serif">
<div style="display:flex;flex-direction:column;gap:6px">
<span style="font:500 13px/1.2 'IBM Plex Mono',monospace;color:#3d3d3d">start.refused</span>
<h1 style="margin:0;font:600 26px/1.2 'IBM Plex Sans',sans-serif;text-wrap:balance">No handwriting service</h1>
<p style="margin:0;max-width:760px;font:400 15px/1.5 'IBM Plex Sans',sans-serif;color:#2b2b2b;text-wrap:pretty">The planner doesn’t start. Missing: the system has no handwriting service; Software is where to get it. Off: handwriting is installed but turned off. Plain words, no error code; the bar isn’t drawn, since there is nothing to navigate.</p>
</div>
<dc-import name="ThemeBar" voice="{{ voice }}" on-pick="{{ pick }}" hint-size="100%,112px"></dc-import>
<dc-import name="Planner" voice="{{ voice }}" orient="portrait" screen="refused" refuse="{{ refuse }}" hint-size="760px,1008px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"voice": {"editor": "enum", "options": ["white", "editorial", "stationery"], "default": "white"}, "refuse": {"editor": "enum", "options": ["missing", "off"], "default": "missing"}, "$preview": {"width": 824, "height": 1352}, "$states": [{"id": "missing", "name": "Not installed", "props": {"refuse": "missing"}}, {"id": "off", "name": "Turned off", "props": {"refuse": "off"}}]}'>
class Component extends DCLogic {
  state = {};
  renderVals() {
    const s = this.state, p = this.props;
    return { voice: s.voice ?? p.voice ?? 'white', pick: (k, v) => this.setState({ [k]: v }), refuse: p.refuse ?? "missing" };
  }
}
</script>
</body>
</html>
