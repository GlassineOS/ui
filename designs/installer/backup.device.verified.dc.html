<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verified</title>
<script src="./support.js"></script>
<script src="data/theme.js"></script>
<script src="data/fixtures.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="ds/web/tokens.css">
<link rel="stylesheet" href="ds/web/bundle.css">
<link rel="stylesheet" href="installer.css">
</helmet>
<dc-import name="Backup" machine="device" state="verified" voice="{{ voice }}" scheme="{{ scheme }}" pen="{{ pen }}" hint-size="100%,1500px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"voice": {"editor": "enum", "options": ["white", "editorial", "stationery"], "default": "white"}, "scheme": {"editor": "enum", "options": ["paper", "night", "eink"], "default": "paper"}, "pen": {"editor": "enum", "options": ["1", "2", "3"], "default": "1"}, "$preview": {"width": 1280, "height": 1500}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { voice: p.voice ?? 'white', scheme: p.scheme ?? 'paper', pen: p.pen ?? '1' };
  }
}
</script>
</body>
</html>
