<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Ink field — preview</title></head>
<body style="margin:0">
<div class="il-page" style="padding:24px 32px;display:grid;grid-template-columns:1fr 1fr;gap:32px">
  <div class="il-inkfield">
    <div class="il-inkfield__line"><span class="il-inkfield__ink">ask about the parcel</span></div>
    <div class="il-inkfield__line"><span class="il-inkfield__ink">call the <span class="is-set">bank</span> today</span></div>
    <div class="il-inkfield__line is-empty"><span class="il-inkfield__ink"></span></div>
  </div>
  <div class="il-inkfield">
    <label class="il-inkfield__label" for="tf">Text mode for this to-do</label>
    <div class="il-inkfield__line"><input class="il-inkfield__text" id="tf" type="text" value="call the bank today"></div>
  </div>
</div>
<script>/* static preview */</script>
</body>
</html>
