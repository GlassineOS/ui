<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home in landscape</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#1b1b1b}a:hover{color:#4a4a4a}</style>
</helmet>
<div data-spec-id="home.landscape" style="width:1124px;height:1120px;box-sizing:border-box;padding:28px 32px;display:flex;flex-direction:column;gap:18px;background:#e6e6e6;color:#1b1b1b;font-family:'IBM Plex Sans',sans-serif">
<div style="display:flex;flex-direction:column;gap:6px">
<span style="font:500 13px/1.2 'IBM Plex Mono',monospace;color:#3d3d3d">home.landscape</span>
<h1 style="margin:0;font:600 26px/1.2 'IBM Plex Sans',sans-serif;text-wrap:balance">Home in landscape</h1>
<p style="margin:0;max-width:760px;font:400 15px/1.5 'IBM Plex Sans',sans-serif;color:#2b2b2b;text-wrap:pretty">936 × 702: a page holds two lanes of 4 columns × 3 rows side by side. Widgets fill the left lane, then the right, then the next page; here Favourite apps (2 rows) and the Updates and sky pair fill the right lane.</p>
</div>
<dc-import name="ThemeBar" voice="{{ voice }}" scheme="{{ scheme }}" pen="{{ pen }}" on-pick="{{ pick }}" hint-size="100%,112px"></dc-import>
<dc-import name="EinkShell" theme="{{ voice }}" scheme="{{ scheme }}" pen="{{ pen }}" view="home" orient="landscape" hint-size="1060px,760px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"voice": {"editor": "enum", "options": ["white", "editorial", "stationery"], "default": "white"}, "$preview": {"width": 1124, "height": 1120}}'>
class Component extends DCLogic {
  state = {};
  renderVals() {
    const s = this.state, p = this.props;
    return { voice: s.voice ?? p.voice ?? 'white', scheme: 'eink', pen: '1', yes: true,
      pick: (k, v) => this.setState({ [k]: v }) };
  }
}
</script>
</body>
</html>
