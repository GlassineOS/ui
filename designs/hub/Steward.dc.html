<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steward</title>
<script src="./support.js"></script>
<script src="data/fixtures.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Kalam&amp;display=swap">
<style>
body{margin:0}
.stw-grip:hover .stw-line,.stw-grip:focus-visible .stw-line{background:#2747b8 !important}
/* Phone (<= 760px): the rail becomes a floating button; the open Steward is a full-screen sheet. */
@media (max-width: 760px){
  .stw-rail{position:fixed !important;right:16px;bottom:16px;width:auto !important;padding:0 !important;border:0 !important;background:transparent !important;z-index:35}
  .stw-rail button{width:56px !important;height:56px !important;box-shadow:0 3px 0 #b4b4b4}
  .stw-panel{position:fixed !important;inset:0;width:auto !important;height:auto !important;z-index:45;border-left:0 !important}
  .stw-grip{display:none !important}
}
</style>
</helmet>
<div style="display: contents">
<sc-if value="{{collapsed}}" hint-placeholder-val="{{false}}">
  <aside aria-label="Steward" class="stw-rail" style="width: 64px; flex: none; align-self: stretch; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 0; border-left: 1.5px solid #111111; background: #f2f2f2; font-family: 'IBM Plex Sans', system-ui, sans-serif">
    <button type="button" onClick="{{expand}}" aria-label="Open the Steward, {{waiting}} waiting" style="position: relative; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1.5px solid #2747b8; border-radius: 999px; background: #ffffff; font-family: Kalam, cursive; font-size: 22px; color: #2747b8; cursor: pointer">S<span aria-hidden="true" style="position: absolute; top: -6px; right: -8px; min-width: 20px; height: 20px; padding: 0 5px; border: 1.5px solid #111111; border-radius: 999px; background: #ffd86b; color: #111111; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; line-height: 17px; box-sizing: border-box">{{waiting}}</span></button>
  </aside>
</sc-if>
<sc-if value="{{expanded}}" hint-placeholder-val="{{true}}">
<aside aria-label="Steward" class="stw-panel" style="position: sticky; top: 0; height: calc(100vh - 66px); width: {{width}}; flex: none; align-self: flex-start; box-sizing: border-box; display: flex; flex-direction: column; border-left: 1.5px solid #111111; background: #f2f2f2; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5; color: #111111">
  <div role="separator" aria-orientation="vertical" aria-label="Resize the Steward. Arrow keys change the width; double-click resets it." aria-valuenow="{{wNum}}" aria-valuemin="320" aria-valuemax="760" tabindex="0" class="stw-grip" onPointerDown="{{gripDown}}" onPointerMove="{{gripMove}}" onPointerUp="{{gripUp}}" onPointerCancel="{{gripUp}}" onKeyDown="{{gripKey}}" onDoubleClick="{{gripReset}}" title="Drag to resize · double-click to reset" style="position: absolute; left: -7px; top: 0; bottom: 0; width: 14px; z-index: 6; cursor: col-resize; display: flex; align-items: center; justify-content: center; touch-action: none">
    <span aria-hidden="true" class="stw-line" style="position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: transparent"></span><span aria-hidden="true" style="{{gripStyle}}"></span>
  </div>
  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 12px 16px; border-bottom: 1.5px solid #111111; background: #ffffff">
    <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; flex: none; border: 1.5px solid #2747b8; border-radius: 999px; font-family: Kalam, cursive; font-size: 21px; color: #2747b8">S</span>
    <span style="display: flex; flex-direction: column; line-height: 1.25; flex: 1; min-width: 0">
      <span style="font-weight: 600">Steward</span>
      <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px"><span style="font-size: 12.5px; color: #4a4a4a">always on</span><dc-import name="StateChip" sid="steward" short="{{yes}}" hint-size="90px,26px"></dc-import></span>
    </span>
    <label style="display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em">MODEL
      <select onChange="{{pickModel}}" style="min-height: 40px; padding: 0 8px; border: 1.5px solid #111111; border-radius: 10px; background: #ffffff; color: #111111; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; letter-spacing: 0">
        <sc-for list="{{models}}" as="m" hint-placeholder-count="4"><option value="{{m.id}}" selected="{{m.sel}}">{{m.name}}</option></sc-for>
      </select></label>
    <button type="button" onClick="{{collapse}}" aria-label="Collapse the Steward" style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 1.5px solid #111111; border-radius: 10px; background: #ffffff; cursor: pointer"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#111111" stroke-width="1.8" aria-hidden="true"><path d="M5 2l5 5-5 5"></path></svg></button>
  </div>
  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 16px; border-bottom: 1px solid #d0d0d0; font-size: 13px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: #4a4a4a">SEES</span>
    <sc-for list="{{sees}}" as="c" hint-placeholder-count="2"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 0 8px; border: 1.5px solid #111111; border-radius: 999px; background: {{c.bg}}">{{c.t}}</span></sc-for>
  </div>
  <sc-if value="{{hasWaiting}}" hint-placeholder-val="{{true}}">
    <button type="button" onClick="{{openInbox}}" aria-haspopup="dialog" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 8px 16px; border: 0; border-bottom: 1px solid #d0d0d0; background: #ffffff; color: #111111; font: inherit; text-align: left; cursor: pointer">
      <span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; padding: 0 7px; border: 1.5px solid #111111; border-radius: 999px; background: #ffd86b; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; box-sizing: border-box">{{waiting}}</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3"><span style="font-weight: 600; font-size: 14.5px">{{waitingTitle}}</span><span style="font-size: 12.5px; color: #4a4a4a">{{waitingSub}}</span></span>
      <span aria-hidden="true" style="font-size: 14px">Open →</span>
    </button>
  </sc-if>
  <div style="flex: 1 1 0; min-height: 0; overflow: hidden">
    <dc-import style="height: 100%" name="SessionView" sid="steward" size="compact" hide-asks="{{yes}}" hint-size="100%,100%"></dc-import>
  </div>
  <div style="display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid #d0d0d0; background: #ffffff">
    <button type="button" onClick="{{openNew}}" style="flex: 1; min-height: 44px; border: 1.5px solid #111111; border-radius: 12px; background: #ffffff; color: #111111; font: inherit; font-weight: 600; cursor: pointer">＋ Plan new work with the Steward</button>
  </div>
</aside>
</sc-if>
<sc-if value="{{inboxOpen}}" hint-placeholder-val="{{false}}">
  <dc-import style="position: static" name="Inbox" filter="steward" layer="{{layer}}" on-close="{{closeInbox}}" hint-size="100%,900px"></dc-import>
</sc-if>
<sc-if value="{{launching}}" hint-placeholder-val="{{false}}">
  <dc-import style="position: static" name="Launch" layer="{{layer}}" entry="new" action="road" by="steward" context="{{ctxLabel}}" why="{{whyText}}" on-close="{{closeNew}}" hint-size="100%,900px"></dc-import>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"context":{"editor":"text","default":"Overview"},"collapsed":{"editor":"boolean","default":false},"width":{"editor":"text","default":"400"},"limit":{"editor":"number","default":3},"layer":{"editor":"enum","options":["fixed","absolute"],"default":"fixed"},"$preview":{"width":400,"height":1200}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    let narrow = false; try { narrow = window.matchMedia('(max-width: 760px)').matches; } catch (e) {}
    let w = parseInt(p.width, 10) || 400; try { const v = parseInt(localStorage.getItem('hub.steward.width'), 10); if (v) w = v; } catch (e) {}
    this.state = { collapsed: p.collapsed !== undefined ? !!p.collapsed : narrow, model: 'claude-sonnet-5-5', open: false, w, drag: null, inbox: false }; }
  setW(w) { const v = Math.max(320, Math.min(760, Math.round(w))); this.setState({ w: v }); try { localStorage.setItem('hub.steward.width', String(v)); } catch (e) {} }
  renderVals() {
    const H = window.HUB, S = this.state, P = this.props;
    const ctx = P.context || 'Overview';
    const waiting = H.interactions.filter((x) => x.session === 'steward').length;
    return {
      collapsed: S.collapsed, expanded: !S.collapsed, width: S.w + 'px', wNum: String(S.w),
      gripDown: (ev) => { try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (e) {} this.setState({ drag: { x: ev.clientX, w: S.w } }); },
      gripMove: (ev) => { const d = this.state.drag; if (!d) return; this.setW(d.w + (d.x - ev.clientX)); },
      gripUp: () => this.setState({ drag: null }),
      gripKey: (ev) => { const k = ev.key; if (k === 'ArrowLeft') { ev.preventDefault(); this.setW(S.w + 24); } else if (k === 'ArrowRight') { ev.preventDefault(); this.setW(S.w - 24); } else if (k === 'Home') { ev.preventDefault(); this.setW(760); } else if (k === 'End') { ev.preventDefault(); this.setW(320); } },
      gripReset: () => this.setW(400),
      hasWaiting: waiting > 0, inboxOpen: S.inbox, openInbox: () => this.setState({ inbox: true }), closeInbox: () => this.setState({ inbox: false }),
      waitingTitle: waiting + ' waiting for you from the Steward', waitingSub: (() => { const b = H.interactions.filter((x) => x.session === 'steward' && (x.kind === 'permission' || x.kind === 'question')).length; return (b ? b + ' blocking · ' : '') + 'opens Needs you'; })(),
      gripStyle: 'display: block; width: 6px; height: 56px; border-radius: 999px; border: 1.5px solid #111111; background: ' + (S.drag ? '#2747b8' : '#ffffff'), waiting: String(waiting),
      expand: () => this.setState({ collapsed: false }), collapse: () => this.setState({ collapsed: true }),
      models: H.models.map(([id, name]) => ({ id, name: name + (id === 'claude-sonnet-5-5' ? ' (default)' : ''), sel: S.model === id })),
      pickModel: (ev) => this.setState({ model: ev.target.value }),
      sees: [{ t: ctx, bg: '#ffffff' }, { t: 'roadmap', bg: '#ffffff' }, { t: 'sessions', bg: '#ffffff' }],
      yes: true, no: false, limit: P.limit === undefined ? 0 : P.limit, layer: P.layer || 'fixed',
      launching: S.open, openNew: () => this.setState({ open: true }), closeNew: () => this.setState({ open: false }), ctxLabel: ctx, whyText: 'You asked me from ' + ctx + '. I filled the brief from what you are looking at; change anything.'
    };
  }
}
</script>
</body>
</html>
